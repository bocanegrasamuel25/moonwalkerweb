<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recuperar contraseña - Moon Walker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles2.css">
    <script src="olvide.js" defer></script>
</head>
<body>
    <main class="auth">
        <aside class="auth-marca">
            <img src="Imagenes/Logo.jpeg" alt="Logo de Moon Walker">
            <h1>Moon Walker</h1>
            <p>Te ayudamos a entrar de nuevo.</p>
        </aside>

        <div id="Sesion">
            <a class="volver" href="login.html">← Volver a iniciar sesión</a>
            <h2>¿Olvidaste tu contraseña?</h2>
            <p class="subtitulo">Escribe el correo de tu cuenta y te enviaremos un enlace para escoger una nueva.</p>

            <form id="Crear_sesion">
                <label for="Correo">Correo electrónico</label>
                <input type="email" id="Correo" placeholder="nombre@correo.com" required autocomplete="email">

                <button type="submit" id="Enviar">Enviar enlace</button>
                <p id="Mensaje" class="aviso" role="status" hidden></p>
            </form>
        </div>
    </main>
</body>
</html>
